name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install Qt runtime dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Sync
        run: uv sync --locked

      - name: PySide6 Essentials import (Windows)
        if: runner.os == 'Windows'
        run: uv run python -c "from PySide6 import QtCore, QtWidgets; print(QtCore.qVersion())"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: ty
        run: uv run ty check

      - name: Tests
        run: uv run pytest
