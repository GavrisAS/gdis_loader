name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            release_tag=$(python3 scripts/next_version.py)
            build_version="${release_tag#v}"
            should_release=true
          else
            release_tag=''
            build_version='0.1'
            should_release=false
          fi
          [[ "$build_version" =~ ^[0-9]+\.[0-9]+$ ]]
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Build version: $build_version"
          if [[ "$should_release" == true ]]; then
            echo "Candidate tag: $release_tag"
          fi

  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
      - run: uv python install 3.14
      - run: sudo apt-get update && sudo apt-get install --yes libegl1
      - run: uv sync --locked
      - run: make check

  build:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build, test, and frozen smoke-test
        shell: pwsh
        run: ./scripts/build_windows.ps1 -BuildVersion "${{ needs.version.outputs.build_version }}"

      - name: Create release checksums and review bundle
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          $zip = "dist/GDIS_DataLoader-v$env:BUILD_VERSION-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -Path "$zip.sha256" -Encoding ascii
          $review = "dist/GDIS_v$env:BUILD_VERSION-review.zip"
          uv run python scripts/bundle_v024_review.py --version $env:BUILD_VERSION --output $review
          if ($LASTEXITCODE -ne 0) { throw "Review bundle generation failed" }
          $reviewHash = (Get-FileHash -Algorithm SHA256 $review).Hash.ToLowerInvariant()
          "$reviewHash  $(Split-Path -Leaf $review)" | Set-Content -Path "$review.sha256" -Encoding ascii

      - name: Upload standalone ZIP and review evidence
        uses: actions/upload-artifact@v4
        with:
          name: GDIS_DataLoader-v${{ needs.version.outputs.build_version }}-windows-x64
          path: |
            dist/GDIS_DataLoader-v${{ needs.version.outputs.build_version }}-windows-x64.zip
            dist/GDIS_DataLoader-v${{ needs.version.outputs.build_version }}-windows-x64.zip.sha256
            dist/GDIS_v${{ needs.version.outputs.build_version }}-review.zip
            dist/GDIS_v${{ needs.version.outputs.build_version }}-review.zip.sha256
          if-no-files-found: error

  release:
    if: needs.version.outputs.should_release == 'true'
    needs: [version, build, linux-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: GDIS_DataLoader-v${{ needs.version.outputs.build_version }}-windows-x64
          path: release-assets

      - name: Verify candidate tag is free and create it
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null; then
            echo "Candidate tag $TAG already exists; refusing to modify it." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Candidate tag $TAG already exists locally; refusing to modify it." >&2
            exit 1
          fi
          git tag "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"
          tagged_sha=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
          if [[ "$tagged_sha" != "$TARGET_SHA" ]]; then
            echo "Remote tag $TAG points to $tagged_sha, expected $TARGET_SHA." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ needs.version.outputs.release_tag }}
          ZIP_PATH: release-assets/GDIS_DataLoader-v${{ needs.version.outputs.build_version }}-windows-x64.zip
          REVIEW_PATH: release-assets/GDIS_v${{ needs.version.outputs.build_version }}-review.zip
          REVIEW_HASH_PATH: release-assets/GDIS_v${{ needs.version.outputs.build_version }}-review.zip.sha256
        run: |
          set -euo pipefail
          test -f "$ZIP_PATH"
          test -f "$ZIP_PATH.sha256"
          test -f "$REVIEW_PATH"
          test -f "$REVIEW_HASH_PATH"
          tagged_sha=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
          [[ "$tagged_sha" == "$TARGET_SHA" ]]
          release_flags=()
          if ! python3 -c 'import tomllib; from pathlib import Path; m=tomllib.loads(Path("docs/CALCULATOR_TEMPLATE_VERSION.toml").read_text()); raise SystemExit(0 if m["canonical"] else 1)'; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" "$ZIP_PATH" "$ZIP_PATH.sha256" "$REVIEW_PATH" "$REVIEW_HASH_PATH" "${release_flags[@]}" \
            templates/calculator/GDIS_Rating_Calculator_STRUCTURAL_v3.xlsx \
            templates/calculator/GDIS_Rating_Calculator_STRUCTURAL_v2.xlsx \
            templates/calculator/archive/GDIS_Rating_Calculator_v0.19_pre_structural.xlsx \
            templates/calculator/SHA256SUMS.txt \
            docs/CALCULATOR_TEMPLATE_VERSION.toml \
            --verify-tag \
            --target "$TARGET_SHA" \
            --title "GDIS Data Loader $TAG" \
            --notes-file docs/RELEASE_NOTES_v0.24.md
          gh release view "$TAG" --json url --jq .url
