name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build, test, and frozen smoke-test
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GDIS_DataLoader-windows-x64
          path: dist/GDIS_DataLoader-windows-x64.zip
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: GDIS_DataLoader-windows-x64
          path: release-assets

      - name: Create unique release tag
        id: release_tag
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          max_attempts=5
          selected_tag=''
          source_zip=$(find release-assets -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [[ -z "$source_zip" ]]; then
            echo "Windows ZIP was not found." >&2
            exit 1
          fi

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch --tags --force origin
            candidate=$(python3 scripts/next_version.py)

            if git ls-remote --exit-code --refs origin "refs/tags/$candidate" >/dev/null; then
              echo "Tag $candidate already exists; recomputing (attempt $attempt/$max_attempts)."
              continue
            fi

            if git rev-parse --verify --quiet "refs/tags/$candidate" >/dev/null; then
              git tag --delete "$candidate"
            fi
            git tag "$candidate" "$TARGET_SHA"

            if git push origin "refs/tags/$candidate"; then
              tagged_sha=$(git ls-remote --refs origin "refs/tags/$candidate" | awk '{print $1}')
              if [[ "$tagged_sha" != "$TARGET_SHA" ]]; then
                echo "Remote tag $candidate points to $tagged_sha, expected $TARGET_SHA." >&2
                exit 1
              fi
              selected_tag="$candidate"
              break
            fi

            git tag --delete "$candidate" >/dev/null || true
            if git ls-remote --exit-code --refs origin "refs/tags/$candidate" >/dev/null; then
              echo "Tag $candidate was created concurrently; retrying."
              continue
            fi
            echo "Could not create release tag $candidate." >&2
            exit 1
          done

          if [[ -z "$selected_tag" ]]; then
            echo "Unable to obtain a unique release tag after $max_attempts attempts." >&2
            exit 1
          fi

          versioned_zip="release-assets/GDIS_DataLoader-${selected_tag}-windows-x64.zip"
          mv "$source_zip" "$versioned_zip"

          echo "tag=$selected_tag" >> "$GITHUB_OUTPUT"
          echo "zip_path=$versioned_zip" >> "$GITHUB_OUTPUT"

      - name: Verify tag target and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          ZIP_PATH: ${{ steps.release_tag.outputs.zip_path }}
        run: |
          set -euo pipefail
          tagged_sha=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
          [[ "$tagged_sha" == "$TARGET_SHA" ]]

          gh release create "$TAG" "$ZIP_PATH" \
            --verify-tag \
            --target "$TARGET_SHA" \
            --title "GDIS Data Loader $TAG" \
            --generate-notes

          release_url=$(gh release view "$TAG" --json url --jq .url)
          echo "Published $release_url"
