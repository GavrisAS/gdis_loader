name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build and test
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload standalone folder
        uses: actions/upload-artifact@v4
        with:
          name: GDIS_DataLoader-windows-x64
          path: dist/GDIS_DataLoader-windows-x64.zip
          if-no-files-found: error
